<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RevVault — Premium Automotive Discovery</title>
  <meta name="description" content="RevVault is a premium automotive discovery platform where enthusiasts explore, save, and compare cars from Ferrari, Lamborghini, Porsche, BMW, and Tesla."/>
  <meta name="theme-color" content="#0F0F14"/>

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- CSS -->
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/animations.css" />

  <!-- Favicon (inline SVG data-URI) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%233B82F6'/><text y='.9em' font-size='70' x='14'>🏎</text></svg>" />
</head>
<body>

  <!-- ===== NAVIGATION ===== -->
  <nav class="nav" id="main-nav">
    <div class="nav__logo" id="nav-logo">
      <div class="nav__logo-icon">🏎</div>
      REV<span>VAULT</span>
    </div>
    <ul class="nav__links" id="nav-links">
      <!-- Populated by app.js -->
    </ul>
    <div class="nav__actions">
      <div class="search-wrap" id="nav-search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          id="nav-search"
          class="search-input"
          placeholder="Search cars…"
          type="search"
          aria-label="Search cars"
        />
      </div>
      <button class="nav__mobile-btn" id="nav-mobile-btn" aria-label="Toggle menu">☰</button>
    </div>
  </nav>

  <!-- ===== APP SHELL ===== -->
  <main id="app" role="main">
    <!-- Pages are rendered here by the router -->
    <div class="loading-dots" style="padding-top:200px">
      <span></span><span></span><span></span>
    </div>
  </main>

  <!-- ===== SCRIPTS (ES modules) ===== -->
  <script type="module" src="js/app.js"></script>

  <!-- Nav logo click handler -->
  <script type="module">
    document.getElementById('nav-logo').addEventListener('click', () => {
      window.location.hash = '/';
    });

    // Global search shortcut
    document.getElementById('nav-search').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = e.target.value.trim();
        if (val) {
          window.location.hash = '/gallery';
          // After navigation, trigger a search
          setTimeout(() => {
            const searchInput = document.getElementById('gal-search');
            if (searchInput) {
              searchInput.value = val;
              searchInput.dispatchEvent(new Event('input'));
            }
          }, 500);
        }
      }
    });
  </script>
</body>
</html>
